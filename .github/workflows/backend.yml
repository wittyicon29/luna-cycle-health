# Backend tests: pytest with coverage against real PostgreSQL 16 and Redis 7 service
# containers, so the Postgres/Redis tests (migrations, key rotation drill, backup/restore
# drills, shared rate-limit counter) run instead of skipping. Replaces test.yml (the
# Codecov upload was dropped: it needs a token for private repositories, and secrets are
# not available to pull requests from forks; coverage goes to the job summary instead).
name: Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash: GitHub then runs it with -eo pipefail.
    shell: bash

jobs:
  test:
    name: pytest (Python 3.11, PostgreSQL 16, Redis 7)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Throwaway CI database reachable only from this job: no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # tests/test_requirements_lock.py must fail, not skip, if it cannot run here.
      LUNA_REQUIRE_LOCK_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock

      # age and the PostgreSQL 16 client tools for the backup/restore drills. Both come from
      # the Ubuntu 24.04 archive (packages.ubuntu.com/noble: age 1.1.1-1ubuntu0.24.04.x,
      # postgresql-client-16 16.x), so pg_dump/pg_restore match the postgres:16 service and
      # no PGDG repository is needed. The bin dir goes first on PATH so the 16 tools are
      # used even if the runner image carries other client versions.
      - name: Install age and the PostgreSQL 16 client tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends age postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          age --version
          command -v age-keygen
          pg_dump --version
          pg_dump --version | grep -Eq ' 16\.' || { echo "pg_dump is not version 16" >&2; exit 1; }
          pg_restore --version | grep -Eq ' 16\.'
          psql --version | grep -Eq ' 16\.'

      # The hash-pinned dev lock (runtime lock + test tools + pip-tools), exactly as locked:
      # --no-deps installs nothing it does not list and pip check proves it is complete.
      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip check
          # Same shellcheck as on the dev machine (0.11.0; the scripts use its SC codes).
          pip install shellcheck-py==0.11.0.1

      # Re-locks requirements.txt / requirements-dev.txt into a temp copy and diffs it with
      # the committed requirements.lock / requirements-dev.lock (needs network for PyPI).
      - name: Check the lock files are in sync with the requirements files
        working-directory: backend
        run: python -m pytest tests/test_requirements_lock.py -v -ra -p no:cacheprovider

      - name: Shellcheck the operations scripts
        run: shellcheck -x scripts/*.sh deploy/smoke.sh

      - name: Run tests with coverage
        working-directory: backend
        # The lock sync check already ran in its own step above.
        run: python -m pytest tests/ -v -ra --cov=app --cov-report=term --junitxml=junit.xml --deselect tests/test_requirements_lock.py::test_locks_are_in_sync_with_their_inputs

      # The drills must run in CI, not skip because a service or tool is missing.
      - name: Fail if a service-backed test was skipped
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          markers = ("TEST_POSTGRES_URL", "TEST_REDIS_URL", "on PATH", "shellcheck not installed")
          bad = []
          for case in ET.parse("junit.xml").getroot().iter("testcase"):
              skipped = case.find("skipped")
              if skipped is not None and any(m in (skipped.get("message") or "") for m in markers):
                  bad.append(f"{case.get('classname')}::{case.get('name')}: {skipped.get('message')}")
          print("\n".join(bad) or "no service-backed test was skipped")
          sys.exit(1 if bad else 0)
          PY

      - name: Coverage summary
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Backend coverage"
              python -m coverage report --format=markdown
            } >> "$GITHUB_STEP_SUMMARY"
          fi
