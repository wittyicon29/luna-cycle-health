# Dependency audits: pip-audit for the backend runtime requirements and npm audit for the
# frontend's non-dev dependencies (high and critical advisories). Findings fail the job
# unless their advisory id is in .github/audit-allowlist.txt with a justification;
# scripts/ci/audit_gate.py applies the allowlist to the JSON reports.
name: Dependency audit

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC: new advisories for unchanged dependencies
  workflow_dispatch:
  pull_request:
    paths:
      - backend/requirements*.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/audit-allowlist.txt
      - scripts/ci/audit_gate.py
      - .github/workflows/audit.yml
  push:
    branches: [main]
    paths:
      - backend/requirements*.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/audit-allowlist.txt
      - scripts/ci/audit_gate.py
      - .github/workflows/audit.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  pip-audit:
    name: pip-audit (backend/requirements.txt)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit
        run: |
          # pip-audit exits 1 when it finds anything; the gate decides (and fails on a missing report).
          pip-audit -r backend/requirements.txt -f json -o "$RUNNER_TEMP/pip-audit.json" ||
            echo "pip-audit exited with $?; the gate below judges the report"
          python scripts/ci/audit_gate.py pip "$RUNNER_TEMP/pip-audit.json" --allowlist .github/audit-allowlist.txt

  npm-audit:
    name: npm audit (frontend, non-dev, high+)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Audit
        run: |
          # npm audit reads package-lock.json; nothing is installed or executed.
          cd frontend
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json" ||
            echo "npm audit exited with $?; the gate below judges the report"
          cd ..
          python3 scripts/ci/audit_gate.py npm "$RUNNER_TEMP/npm-audit.json" --min-severity high --allowlist .github/audit-allowlist.txt
