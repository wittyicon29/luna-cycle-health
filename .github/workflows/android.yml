# Builds the Android debug APK (Capacitor shell) so native changes are verified in CI.
# The runner image ships JDK 21 and Android platform/build-tools 36; the signed release
# bundle is built locally by scripts/android/release.sh (signing material never reaches CI).
name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: frontend

jobs:
  debug-apk:
    name: Debug APK and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REACT_APP_API_BASE: https://api.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            frontend/android/**/*.gradle*
            frontend/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web app and sync it into the Android project
        run: npm run android:sync

      - name: Assemble the debug APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Android lint (reports; errors reviewed by hand until a baseline exists)
        working-directory: frontend/android
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luna-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: luna-lint-report
          path: frontend/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
