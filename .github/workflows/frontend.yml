# Frontend checks: i18n catalogue check, jest, and the production build with the
# warning gate (react-scripts treats warnings as errors when CI=true, so the build runs
# with CI=false and scripts/check-build-warnings.js fails above the baseline of 15).
name: Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: frontend

jobs:
  test:
    name: i18n, jest and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: i18n check
        run: npm run i18n:check

      - name: Jest
        run: CI=true npm test -- --watchAll=false

      - name: Build (warning gate, max 15 ESLint warnings)
        run: node scripts/check-build-warnings.js --max 15
